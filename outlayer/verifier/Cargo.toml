[package]
name = "dibs-verifier"
version = "0.1.0"
edition = "2021"
description = "Dibs verifier: DKIM-checked booking facts and VRF draws, signed by the OutLayer project key"

[lib]
name = "dibs_verifier"
path = "src/lib.rs"

[[bin]]
name = "dibs-verifier"
path = "src/main.rs"

[features]
default = []
# Testnet build only: also trusts the fixture domain `dibs-test.example` with its published fixture key.
test-domain = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
aes-gcm = "0.10"
ed25519-dalek = { version = "2", default-features = false }
wasi-http-client = "0.2"
outlayer = { version = "0.2", features = ["signing-keys"] }

[dev-dependencies]
rsa = { version = "0.9", features = ["pem", "sha2"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
