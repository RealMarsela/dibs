name = "dibs-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
routes = [{ pattern = "api.dibs.larinova.com", custom_domain = true }]

# Default = testnet. Mainnet is a separate deploy: `wrangler deploy --env mainnet`.
[vars]
NEAR_NETWORK = "testnet"
NEAR_RPC_URLS = "https://test.rpc.fastnear.com,https://rpc.testnet.near.org"
ONECLICK_URL = "https://1click.chaindefuser.com"
# TODO(coordinator): fill after Lane A deploys.
DIBS_CONTRACT = "dibs-0eb9ae.testnet"
USDC_CONTRACT = "usdc.own-0eb9ae.testnet"
RELAYER_ACCOUNT_ID = "relayer.dao-0eb9ae.testnet"
ALLOWED_ORIGIN = "https://dibs.larinova.com,http://localhost:4321"
# Public base URL used to build blob capability URLs (no trailing slash). Empty = request origin.
PUBLIC_BASE_URL = "https://api.dibs.larinova.com"
VERIFIER_PUBLIC_KEY = "706445d7daa364e38ea0f410fc3279c83b6200c5cfd89983546b8fecbb3706bf"
TRIP_DAO = "lis0312-0eb9ae.sputnik-v2.testnet"
CF_ZONE_ID = "bbaaf33c5998f5ebb76ea82164662d98"
MAIL_DOMAIN = "dibs.larinova.com"
# Testnet EVM deposit (src/evmdeposit.ts): Base Sepolia test USDC lands here. Its key is held offline, never in the repo.
TESTNET_EVM_DEPOSIT = "0xad3bbf501fee270894c3a77ff383dd6c3e9fc30b"
BASE_SEPOLIA_RPC_URLS = "https://sepolia.base.org,https://base-sepolia-rpc.publicnode.com"
# /mainnet/* (src/mainnet.ts): the pay-in on NEAR mainnet. Secret: MAINNET_RELAYER_PRIVATE_KEY.
MAINNET_RPC_URLS = "https://free.rpc.fastnear.com,https://rpc.mainnet.near.org"
MAINNET_DIBS_CONTRACT = "dibsapp.near"
MAINNET_USDC_CONTRACT = "17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1"
MAINNET_RELAYER_ACCOUNT_ID = "relayer.dibsapp.near"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "dibs-proof-blobs"

[[kv_namespaces]]
binding = "NAMES"
id = "80abbc4f85b24a17ac7bfda76a188df6"

[env.mainnet]
name = "dibs-api-mainnet"

[env.mainnet.vars]
NEAR_NETWORK = "mainnet"
NEAR_RPC_URLS = "https://free.rpc.fastnear.com,https://rpc.mainnet.near.org"
ONECLICK_URL = "https://1click.chaindefuser.com"
DIBS_CONTRACT = "dibs-REPLACE.near"
USDC_CONTRACT = "17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1"
RELAYER_ACCOUNT_ID = "dibs-relayer-REPLACE.near"
ALLOWED_ORIGIN = "*"
PUBLIC_BASE_URL = ""

[[env.mainnet.r2_buckets]]
binding = "BLOBS"
bucket_name = "dibs-blobs-mainnet"
